<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#012624" />
    <meta name="color-scheme" content="dark" />
    <title>Luis Franco, desarrollador frontend</title>
    <meta
      name="description"
      content="CV interactivo de Luis Fernando Franco Morales, desarrollador frontend en formación en Marbella. Proyectos cargados en directo desde GitHub."
    />
    <meta property="og:title" content="Luis Franco, desarrollador frontend" />
    <meta property="og:description" content="CV interactivo con proyectos cargados en directo desde GitHub." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Aplica el idioma guardado antes de pintar, para evitar parpadeos.
      (function () {
        try {
          var idioma = JSON.parse(localStorage.getItem("cv:idioma"));
          if (idioma) document.documentElement.lang = idioma;
        } catch (e) {}
        // Las animaciones de scroll se activan antes de pintar (sin parpadeo)
        // y solo si el sistema no pide reducir el movimiento.
        if (
          "IntersectionObserver" in window &&
          !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)
        ) {
          document.documentElement.classList.add("anima");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Esta web necesita JavaScript. Puedes ver mi trabajo en
        <a href="https://github.com/Luisff511">GitHub</a> y mi perfil en
        <a href="https://www.linkedin.com/in/luis-fernando-franco-morales-167978276/">LinkedIn</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
